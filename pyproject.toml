[project]
name = "rvz-workspace"
version = "0"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "rvz",
  "rvz-performance",
  "rvz-tools",
]

[dependency-groups]
dev = [
  "mypy>=1.14.1",
  "pre-commit>=3.5",
  "pytest>=8.3.5",
  "ruff>=0.15.14",
  "ty>=0.0.39",
]

[tool.uv]
required-version = ">=0.11.8"
sources.rvz = { workspace = true }
sources.rvz-performance = { workspace = true }
sources.rvz-tools = { workspace = true }
exclude-newer = "2 weeks"
package = false
workspace.members = [ "packages/*" ]

[tool.ruff]
line-length = 120
lint.select = [ "ANN", "B", "E", "F", "I", "S", "SIM", "UP" ]
lint.ignore = [
  "S324",   # RVZ and Wii disc formats require SHA-1 digests for integrity data.
  "SIM117",
  "UP045",
]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
warn_unused_configs = true
no_implicit_optional = true

[tool.ty]
environment.python-version = "3.8"
rules.all = "warn"
