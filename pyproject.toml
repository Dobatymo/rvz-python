[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61" ]

[project]
name = "rvz"
version = "0.1.0"
description = "Pure Python reader for Dolphin RVZ disc images"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cryptography>=47",
  "typing-extensions>=4",
  "zstandard>=0.23",
]
urls.Repository = "https://github.com/Dobatymo/rvz-python"
scripts.rvz = "rvz.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14.1",
  "pre-commit>=3.5",
  "pytest>=8.3.5",
  "ruff>=0.15.14",
  "ty>=0.0.39",
]

[tool.uv]
required-version = ">=0.11.8"
exclude-newer = "2 weeks"

[tool.ruff]
line-length = 120
lint.select = [ "ANN", "B", "E", "F", "I", "S", "SIM", "UP" ]
lint.ignore = [
  "S324",   # RVZ and Wii disc formats require SHA-1 digests for integrity data.
  "SIM117",
  "UP045",
]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
warn_unused_configs = true
no_implicit_optional = true

[tool.ty]
environment.python-version = "3.8"
rules.all = "warn"
