name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --locked --all-packages --all-extras
    - name: Mypy
      run: |
        uv run --locked mypy packages/rvz-performance
        uv run --locked mypy packages/rvz
        uv run --locked mypy packages/rvz-tools
    - name: Lint
      run: uv run --locked ruff check .
    - name: Format
      run: uv run --locked ruff format --check .
    - name: Type check
      run: uv run --locked ty check
    - name: Core unit tests
      working-directory: packages/rvz
      run: uv run --locked pytest .
    - name: Performance unit tests
      working-directory: packages/rvz-performance
      run: uv run --locked pytest .
    - name: Tools unit tests
      working-directory: packages/rvz-tools
      run: uv run --locked pytest .

  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        python-version: '3.14'
    - name: Build all workspace packages
      run: uv build --all-packages --out-dir dist
    - name: Verify pure Python core wheel
      run: >-
        uv run --no-project --with ./dist/rvz-0.1.0-py3-none-any.whl python -c
        "import importlib.util; from rvz.packing import generate_padding;
        assert importlib.util.find_spec('rvz_performance') is None;
        assert len(generate_padding(bytes(range(68)), 32)) == 32"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        python-version: '3.14'
    - name: Analyze workflows
      run: uvx --python 3.14 zizmor==1.25.2 --format=github .github/workflows
