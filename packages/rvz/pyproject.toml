[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61" ]

[project]
name = "rvz"
version = "0.1.0"
description = "Pure Python reader for Dolphin RVZ disc images"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cryptography>=47",
  "typing-extensions>=4",
  "zstandard>=0.23",
]
optional-dependencies.performance = [ "rvz-performance>=0.1,<0.2" ]
urls.Repository = "https://github.com/Dobatymo/rvz-python"
scripts.rvz = "rvz.cli:main"

[tool.setuptools]
packages = [ "rvz" ]
package-dir = { "" = "src" }
